[tools]
"github:xmake-io/xmake" = { version = "latest", bin = "xmake" }
clang-format = "latest"
"conda:cppcheck" = "2.20.1"
go = "1.26.5"
goreleaser = "2.18.3"
golangci-lint = "2.10.1"
"go:golang.org/x/tools/cmd/goimports" = "0.42.0"
"go:mvdan.cc/gofumpt" = "0.9.2"

[tasks.build]
description = "build Dynamips"
run = "xmake f -m release -y && xmake -j \"${DYNAMIPS_BUILD_JOBS:-14}\" -y"

[tasks.dev]
description = "build Dynamips in debug mode"
run = "xmake f -m debug -y && xmake -j \"${DYNAMIPS_BUILD_JOBS:-14}\" -y"

[tasks.test]
description = "run the Go binding tests"
depends = ["test:go"]

[tasks."build:native"]
description = "build and install the native embedding libraries"
run = "xmake f -m debug --system_packages=y -y && xmake build -j \"${DYNAMIPS_BUILD_JOBS:-14}\" -y dynamips-bindings && xmake install -o \"$PWD/build/install\" dynamips-bindings dynamips-core"

[tasks."package:native"]
description = "stage the Linux amd64 native release"
run = """
test "$(uname -s):$(uname -m)" = Linux:x86_64 || { echo 'Native releases support Linux amd64 only' >&2; exit 2; }
xmake f -m release --dynamips_arch=amd64 --system_packages=y --enable_gen_eth=y -y
xmake build -j "${DYNAMIPS_BUILD_JOBS:-14}" -y dynamips-bindings
xmake install -o "$PWD/build/release" dynamips-bindings dynamips-core
"""

[tasks."release:check"]
description = "validate the release configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "build and test native release archives without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "publish the current version tag"
run = "goreleaser release --clean"

[tasks."test:go"]
description = "test the Go bindings"
depends = ["build:native"]
run = 'PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" go test -a -count=1 ./...'

[tasks."test:ios"]
description = "boot a local C7200 IOS archive through embedded and legacy APIs"
run = """
test -n "${DYNAMIPS_IOS_ARCHIVE:-}" || { echo 'set DYNAMIPS_IOS_ARCHIVE to a local C7200 zip archive' >&2; exit 2; }
xmake f -m debug --dynamips_arch=amd64 -y
xmake -j "${DYNAMIPS_BUILD_JOBS:-14}" -y
xmake install -o "$PWD/build/install" dynamips-bindings dynamips-core
export PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
# Go's cache does not track changes to external native archives.
go test -a ./internal/binding -run '^TestC7200IOSBootParity$' -count=1 -v -timeout=8m
"""

[tasks."lint:go"]
description = "lint the Go bindings"
depends = ["build:native"]
run = """
go tool repolint .
PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" golangci-lint run ./...
"""

[tasks."lint:cppcheck"]
description = "check the C and C++ embedding boundary"
run = """
cppcheck --enable=warning,performance,portability --std=c++23 --language=c++ --error-exitcode=1 --quiet -I include -I common -I stable bindings/*.cpp
cppcheck --enable=warning,performance,portability --std=c23 --language=c --error-exitcode=1 --quiet -I include -I common -I stable common/dynamips_bridge_*.c
"""

[tasks."lint:cpp"]
description = "lint the C++ bindings after generating compile commands"
depends = ["compiledb", "lint:cppcheck"]
# Identifier macros cannot parenthesize their names; paired string_view API args are intentional.
run = "clang-tidy -p . -checks='clang-analyzer-*,bugprone-*,-bugprone-macro-parentheses,-bugprone-easily-swappable-parameters' -warnings-as-errors='clang-analyzer-*,bugprone-*' bindings/*.cpp --quiet"

[tasks."lint:cpp:ports"]
description = "check migrated helpers and I/O with strict compiler warnings"
depends = ["compiledb"]
run = """
clang-tidy -p . -checks='-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*,clang-analyzer-deadcode.*,clang-analyzer-unix.*,bugprone-use-after-move' -warnings-as-errors='*' \
  --extra-arg=-fasm --extra-arg=-Wall --extra-arg=-Wextra \
  --extra-arg=-Wpedantic --extra-arg=-Wshadow --extra-arg=-Wconversion \
  --extra-arg=-Wsign-conversion --extra-arg=-Werror --quiet \
  common/host_memory.cpp common/rommon_var.cpp common/net_packet.cpp \
  common/net_io_udp.cpp common/vtty_io.cpp
"""

[tasks."test:native"]
description = "test the C++ module"
depends = ["build:native"]
run = "xmake build -j \"${DYNAMIPS_BUILD_JOBS:-14}\" -y dynamips-module-test && xmake run dynamips-module-test"

[tasks."run:example"]
description = "boot a C7200 image and open its IOS console"
depends = ["build:native"]
run = """
test -n "${DYNAMIPS_IOS_IMAGE:-}" || { echo 'set DYNAMIPS_IOS_IMAGE to a local C7200 IOS image or zip archive' >&2; exit 2; }
PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" go run ./examples/basic -ios "$DYNAMIPS_IOS_IMAGE"
"""

[tasks.compiledb]
description = "generate clangd compile commands for C and C++ sources"
depends = ["build:native"]
run = "xmake project -k compile_commands --lsp=clangd ."

[tasks.format]
description = "format C and C++ sources"
run = "find bindings common stable include modules -type f \\( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.cppm' \\) -print0 | xargs -0 clang-format -i"

[tasks."fmt:go"]
description = "format Go code"
run = "find . -path ./build -prune -o -name '*.go' -print0 | xargs -0 goimports -w && find . -path ./build -prune -o -name '*.go' -print0 | xargs -0 gofumpt -w && go mod tidy && go -C examples/consumer mod tidy"

[tasks.clean]
description = "remove generated build files"
run = "xmake clean -a && rm -rf build compile_commands.json"

[tasks."fix:go"]
description = "Apply permitted Go policy fixes"
run = "go tool repolint --fix ."

[tasks."lint:architecture"]
description = "Check repository contracts with repolint"
run = '''
root="$PWD"
if [ -n "${REPOLINT_BIN:-}" ]; then
  "$REPOLINT_BIN" --require-rules=package-boundaries,native-call-lock,native-allocation,native-length,no-discarded-cleanup-error,subprocess-context,suppression-policy,schema-drift --config "$root/.repolint-architecture.toml" "$root"
else
  source="${REPOLINT_SOURCE:-../repolint}"
  if [ ! -f "$source/go.mod" ]; then
    echo "repolint checkout missing: $source; set REPOLINT_SOURCE or REPOLINT_BIN" >&2
    exit 2
  fi
  go -C "$source" run ./cmd/repolint --require-rules=package-boundaries,native-call-lock,native-allocation,native-length,no-discarded-cleanup-error,subprocess-context,suppression-policy,schema-drift --config "$root/.repolint-architecture.toml" "$root"
fi
'''

[tasks.check]
description = "Check Go policies, native contracts, and bindings"
depends = ["lint:architecture", "lint:go", "test:go"]
