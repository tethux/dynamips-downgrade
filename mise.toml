[tools]
"github:xmake-io/xmake" = "latest"
clang-format = "latest"
"conda:cppcheck" = "2.20.1"
go = "1.26.5"
golangci-lint = "2.10.1"
"go:golang.org/x/tools/cmd/goimports" = "0.42.0"
"go:mvdan.cc/gofumpt" = "0.9.2"

[tasks.build]
description = "build Dynamips"
run = "xmake f -m release -y && xmake -y"

[tasks.dev]
description = "build Dynamips in debug mode"
run = "xmake f -m debug -y && xmake -y"

[tasks.test]
description = "run the Go binding tests"
depends = ["test:go"]

[tasks."build:native"]
description = "build the native library for Go"
run = "xmake f -m debug -y && xmake build -y dynamips-bindings"

[tasks."test:go"]
description = "test the Go bindings"
depends = ["test:native"]
run = "go test ./..."

[tasks."lint:go"]
description = "lint the Go bindings"
depends = ["build:native"]
run = "golangci-lint run ./..."

[tasks."lint:cppcheck"]
description = "check the C and C++ embedding boundary"
run = """
cppcheck --enable=warning,performance,portability --std=c++20 --language=c++ --error-exitcode=1 --quiet -I include -I common -I stable bindings/*.cpp
cppcheck --enable=warning,performance,portability --std=c11 --language=c --error-exitcode=1 --quiet -I include -I common -I stable common/dynamips_bridge_*.c
"""

[tasks."lint:cpp"]
description = "lint the C++ bindings after generating compile commands"
depends = ["build:native", "lint:cppcheck"]
# Identifier macros cannot parenthesize their names; paired string_view API args are intentional.
run = "clang-tidy -p . -checks='clang-analyzer-*,bugprone-*,-bugprone-macro-parentheses,-bugprone-easily-swappable-parameters' -warnings-as-errors='clang-analyzer-*,bugprone-*' bindings/*.cpp --quiet"

[tasks."test:native"]
description = "test the C++ module"
depends = ["build:native"]
run = "xmake build -y dynamips-module-test && xmake run dynamips-module-test"

[tasks."run:example"]
description = "run the Go bindings example"
depends = ["build:native"]
run = "go run ./go/examples/basic -ios \"${DYNAMIPS_IOS_IMAGE:?set DYNAMIPS_IOS_IMAGE to an extracted C7200 IOS image}\""

[tasks.run]
description = "run the Dynamips executable"
depends = ["build"]
run = "xmake run dynamips"

[tasks.compiledb]
description = "generate clangd compile commands, including C++ modules"
depends = ["build:native"]
run = "xmake project -k compile_commands --lsp=clangd ."

[tasks.format]
description = "format C and C++ sources"
run = "find bindings common stable include modules -type f \\( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.cppm' \\) -print0 | xargs -0 clang-format -i"

[tasks."fmt:go"]
description = "format Go code"
run = "find . -path ./build -prune -o -name '*.go' -print0 | xargs -0 goimports -w && find . -path ./build -prune -o -name '*.go' -print0 | xargs -0 gofumpt -w"

[tasks.clean]
description = "remove generated build files"
run = "xmake clean -a && rm -rf build compile_commands.json"
