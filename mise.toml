[tools]
"github:xmake-io/xmake" = { version = "latest", bin = "xmake" }
clang-format = "latest"
"conda:cppcheck" = "2.20.1"
go = "1.26.5"
goreleaser = "2.18.3"
golangci-lint = "2.10.1"
"go:golang.org/x/tools/cmd/goimports" = "0.42.0"
"go:mvdan.cc/gofumpt" = "0.9.2"

[tasks.build]
description = "build Dynamips"
run = "xmake f -m release -y && xmake -j \"${DYNAMIPS_BUILD_JOBS:-14}\" -y"

[tasks.dev]
description = "build Dynamips in debug mode"
run = "xmake f -m debug -y && xmake -j \"${DYNAMIPS_BUILD_JOBS:-14}\" -y"

[tasks."run:jit"]
description = "build and run the standalone MIPS-to-native playground"
run = 'xmake build -y jit-playground && xmake run jit-playground "$@"'

[tasks."run:c7200"]
description = "build and run C7200 with an isolated release profile"
quiet = true
run = 'cd tools/boot-release && xmake f -P . -q -m release --system_packages=y -y && xmake build -P . -q -y c7200-boot && xmake run -P . -q c7200-boot "$@"'

[tasks."run:c7200:dev"]
description = "run C7200 with the current development build configuration"
quiet = true
run = 'xmake build -q -y c7200-boot && xmake run -q c7200-boot "$@"'

[tasks."test:jit"]
description = "compare native JIT execution with MIPS register semantics"
run = "xmake test --output-on-failure 'jit-test/*'"

[tasks.test]
description = "build once and run all native and Go tests"
depends = ["build:native"]
quiet = true
run = '''
set -eu
echo "Building the legacy integration fixture"
xmake build -j "${DYNAMIPS_BUILD_JOBS:-14}" -y dynamips
echo "Running native tests"
xmake test --output-on-failure -j "${DYNAMIPS_BUILD_JOBS:-14}"
echo "Running Go tests"
PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" go test -a -count=1 ./...
echo "All test suites passed"
'''

[tasks."test:core"]
description = "test JIT, queued devices and guest memory"
run = "xmake test --output-on-failure 'jit-test/*' 'interpreter-test/*' 'mmu-test/*' 'cpu-fault-test/*' 'physical-test/*' 'exceptions-test/*' 'memory-test/*' 'device-test/*'"

[tasks."test:devices"]
description = "test queued UART dispatch, FIFO backpressure and MMIO"
run = "xmake test --output-on-failure 'jit-test/devices' 'memory-test/*' 'device-test/*'"

[tasks."test:console"]
description = "test real Unix console streams, backpressure and cancellation"
run = "xmake test --output-on-failure 'console-test/*'"

[tasks."test:boot"]
description = "gate each boot change with JIT semantics and the real C7200 ROM boundary"
# Rebuild module consumers together to avoid stale Clang BMI crashes.
run = "xmake build -r -y jit-test interpreter-test mmu-test cpu-fault-test physical-test exceptions-test temperature-test machine-test c7200-boot && xmake test --output-on-failure 'jit-test/*' 'interpreter-test/*' 'mmu-test/*' 'cpu-fault-test/*' 'physical-test/*' 'exceptions-test/*' 'temperature-test/*' 'machine-test/*'"

[tasks."test:machine"]
description = "test chassis composition, ELF loading and the real C7200 ROM boot boundary"
run = "xmake test --output-on-failure 'machine-test/*' 'temperature-test/*'"

[tasks."test:host"]
description = "test shared host helpers through C++ modules and real C callers"
run = "xmake test --output-on-failure 'host-test/*'"

[tasks."test:memory"]
description = "test two-level guest memory access and faults"
run = "xmake test --output-on-failure 'memory-test/*'"

[tasks."bench:memory"]
description = "benchmark release RAM access against the real legacy MTS callback"
run = "xmake f -m release --system_packages=y -y && xmake build -j 14 -y memory-bench && xmake run memory-bench"

[tasks."build:native"]
description = "build and install the native embedding libraries"
run = "xmake f -m debug --system_packages=y -y && xmake build -j \"${DYNAMIPS_BUILD_JOBS:-14}\" -y dynamips-bindings && xmake install -o \"$PWD/build/install\" dynamips-bindings dynamips-core"

[tasks."package:native"]
description = "stage the Linux amd64 native release"
run = """
test "$(uname -s):$(uname -m)" = Linux:x86_64 || { echo 'Native releases support Linux amd64 only' >&2; exit 2; }
xmake f -m release --dynamips_arch=amd64 --system_packages=y --enable_gen_eth=y -y
xmake build -j "${DYNAMIPS_BUILD_JOBS:-14}" -y dynamips-bindings
xmake install -o "$PWD/build/release" dynamips-bindings dynamips-core
"""

[tasks."release:check"]
description = "validate the release configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "build and test native release archives without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "publish the current version tag"
run = "goreleaser release --clean"

[tasks."test:go"]
description = "test the Go bindings"
depends = ["build:native"]
run = 'PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" go test -a -count=1 ./...'

[tasks."test:ios"]
description = "boot a local C7200 IOS archive through embedded and legacy APIs"
run = """
test -n "${DYNAMIPS_IOS_ARCHIVE:-}" || { echo 'set DYNAMIPS_IOS_ARCHIVE to a local C7200 zip archive' >&2; exit 2; }
xmake f -m debug --dynamips_arch=amd64 -y
xmake -j "${DYNAMIPS_BUILD_JOBS:-14}" -y
xmake install -o "$PWD/build/install" dynamips-bindings dynamips-core
export PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
# Go's cache does not track changes to external native archives.
go test -a ./internal/binding -run '^TestC7200IOSBootParity$' -count=1 -v -timeout=8m
"""

[tasks."lint:go"]
description = "lint the Go bindings"
depends = ["build:native"]
run = """
go tool repolint .
PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" golangci-lint run ./...
"""

[tasks."lint:cppcheck"]
description = "check the C and C++ embedding boundary"
run = """
cppcheck --enable=warning,performance,portability --std=c++23 --language=c++ --error-exitcode=1 --quiet -I include -I common -I stable bindings/*.cpp
cppcheck --enable=warning,performance,portability --std=c23 --language=c --error-exitcode=1 --quiet -I include -I common -I stable common/dynamips_bridge_*.c
"""

[tasks."lint:cpp"]
description = "lint the C++ bindings after generating compile commands"
depends = ["compiledb", "lint:cppcheck"]
# Identifier macros cannot parenthesize their names; paired string_view API args are intentional.
run = "clang-tidy -p . -checks='clang-analyzer-*,bugprone-*,-bugprone-macro-parentheses,-bugprone-easily-swappable-parameters' -warnings-as-errors='clang-analyzer-*,bugprone-*' bindings/*.cpp --quiet"

[tasks."lint:cpp:ports"]
description = "check migrated helpers and I/O with strict compiler warnings"
depends = ["compiledb"]
run = """
clang-tidy -p . -checks='-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*,clang-analyzer-deadcode.*,clang-analyzer-unix.*,bugprone-use-after-move' -warnings-as-errors='*' \
  --extra-arg=-Wall --extra-arg=-Wextra \
  --extra-arg=-Wpedantic --extra-arg=-Wshadow --extra-arg=-Wconversion \
  --extra-arg=-Wsign-conversion --extra-arg=-Werror --quiet \
  src/host/native_fd.cppm src/host/host_memory.cppm src/host/console.cppm src/devices/console.cppm common/host_memory_compat.cpp common/rommon_var.cpp common/net_packet.cppm \
  common/net_io_udp.cppm common/vtty_io.cppm
"""

[tasks."lint:cpp:jit"]
description = "check JIT and device modules, including editor warnings"
depends = ["compiledb"]
# MissingIncludes does not recognize native module imports; keep unused-header checks.
run = """
clang-tidy -p . -checks='-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*,clang-analyzer-deadcode.*,clang-analyzer-unix.*,bugprone-use-after-move,bugprone-unused-return-value,misc-include-cleaner' -config='{CheckOptions: {misc-include-cleaner.MissingIncludes: false}}' -warnings-as-errors='*' --quiet \
  src/jit/*.cppm src/devices/*.cppm src/machine/*.cppm src/boot_main.cpp src/jit_main.cpp tests/console.cpp tests/console_guest.cpp tests/machine.cpp tests/temperature.cpp tests/jit.cpp tests/interpreter.cpp tests/mmu.cpp tests/cpu_faults.cpp tests/physical.cpp tests/exceptions.cpp tests/memory.cpp tests/devices.cpp
"""

[tasks."lint:clangd"]
description = "check clangd parsing for playground modules and consumers"
depends = ["compiledb"]
run = '''
set -eu
for source in modules/asmjit.cppm src/host/*.cppm src/jit/*.cppm src/devices/*.cppm src/machine/*.cppm src/boot_main.cpp src/jit_main.cpp tests/console.cpp tests/console_guest.cpp tests/machine.cpp tests/temperature.cpp tests/jit.cpp tests/interpreter.cpp tests/mmu.cpp tests/cpu_faults.cpp tests/physical.cpp tests/exceptions.cpp tests/memory.cpp tests/devices.cpp tests/host.cpp tests/host_compat.c common/host_memory_compat.cpp; do
  echo "Checking clangd: $source"
  clangd --check="$source" --tweaks= --log=error
done
'''

[tasks."test:native"]
description = "test the C++ module"
depends = ["build:native"]
run = "xmake test --output-on-failure 'dynamips-module-test/*'"

[tasks."run:example"]
description = "boot a C7200 image and open its IOS console"
depends = ["build:native"]
run = """
test -n "${DYNAMIPS_IOS_IMAGE:-}" || { echo 'set DYNAMIPS_IOS_IMAGE to a local C7200 IOS image or zip archive' >&2; exit 2; }
PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" go run ./examples/basic -ios "$DYNAMIPS_IOS_IMAGE"
"""

[tasks.compiledb]
description = "generate clangd compile commands for C and C++ sources"
depends = ["build:native"]
run = '''
set -eu
xmake build -y jit-playground jit-test interpreter-test mmu-test cpu-fault-test physical-test exceptions-test memory-test device-test host-test console-test temperature-test machine-test c7200-boot memory-bench dynamips-module-test
compiledb_stage=$(mktemp -d "$PWD/build/compiledb.XXXXXX")
trap 'rm -rf "$compiledb_stage"' EXIT
xmake project -k compile_commands --lsp=clangd "$compiledb_stage"
mv "$compiledb_stage/compile_commands.json" "$PWD/compile_commands.json"
'''

[tasks.format]
description = "format C and C++ sources"
run = "find bindings common stable include modules src tests benchmarks -type f \\( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.cppm' \\) -print0 | xargs -0 clang-format -i"

[tasks."fmt:go"]
description = "format Go code"
run = "find . -path ./build -prune -o -name '*.go' -print0 | xargs -0 goimports -w && find . -path ./build -prune -o -name '*.go' -print0 | xargs -0 gofumpt -w && go mod tidy && go -C examples/consumer mod tidy"

[tasks.clean]
description = "remove generated build files"
run = "xmake clean -a && rm -rf build compile_commands.json"

[tasks."fix:go"]
description = "Apply permitted Go policy fixes"
run = "go tool repolint --fix ."

[tasks."lint:architecture"]
description = "Check repository contracts with repolint"
run = '''
root="$PWD"
if [ -n "${REPOLINT_BIN:-}" ]; then
  "$REPOLINT_BIN" --require-rules=package-boundaries,native-call-lock,native-allocation,native-length,no-discarded-cleanup-error,subprocess-context,suppression-policy,schema-drift --config "$root/.repolint-architecture.toml" "$root"
else
  source="${REPOLINT_SOURCE:-../repolint}"
  if [ ! -f "$source/go.mod" ]; then
    echo "repolint checkout missing: $source; set REPOLINT_SOURCE or REPOLINT_BIN" >&2
    exit 2
  fi
  go -C "$source" run ./cmd/repolint --require-rules=package-boundaries,native-call-lock,native-allocation,native-length,no-discarded-cleanup-error,subprocess-context,suppression-policy,schema-drift --config "$root/.repolint-architecture.toml" "$root"
fi
'''

[tasks.check]
description = "Check policies, native code, clangd, and all tests"
depends = ["lint:architecture", "lint:go", "lint:cpp", "lint:cpp:ports", "lint:cpp:jit", "lint:clangd"]
# Build and lint finish before tests to avoid concurrent xmake mutations.
run = "mise run test"
