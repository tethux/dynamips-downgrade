schema=1
[rules.no-any]
enabled=false
[rules.direct-error-comparison]
enabled=false
[rules.native-call-lock]
enabled=true
paths=["internal/binding"]
[rules.native-allocation]
enabled=true
paths=["internal/binding"]
[rules.native-length]
enabled=true
paths=["internal/binding"]
sources=["*.size"]
exclude_functions=["copyNativeBytes"]
[rules.no-discarded-cleanup-error]
enabled=true
type_check=true
paths=["internal/binding","console","examples/basic"]
calls=["*.Close", "*.Delete"]
[rules.subprocess-context]
enabled=true
paths=["console","examples/basic"]
[rules.suppression-policy]
enabled=true
check_unused=true
[rules.schema-drift]
enabled=true
schema_files=["bindings/schema/*.yaml"]
headers=["include/dynamips/*.h"]
c_definitions=["bindings/*.cpp", "common/dynamips.c"]
cpp_files=["modules/*.cppm"]
go_files=["dynamips.go"]
calls=["cmd_*"]
allow_c_symbols=["dyn_runtime_init", "dyn_runtime_is_initialized", "dyn_result_message", "dyn_bytes_release", "dyn_vm_release", "dyn_nio_release", "dyn_eth_switch_release"]
[rules.schema-drift.header_copies]
"include/dynamips/dynamips.h"="internal/binding/dynamips.h"
"include/dynamips/eth_switch.h"="internal/binding/eth_switch.h"
"include/dynamips/macros.h"="internal/binding/macros.h"
"include/dynamips/nio.h"="internal/binding/nio.h"
"include/dynamips/platform.h"="internal/binding/platform.h"
"include/dynamips/result.h"="internal/binding/result.h"
"include/dynamips/runtime.h"="internal/binding/runtime.h"
"include/dynamips/vm.h"="internal/binding/vm.h"

[rules.package-boundaries]
enabled=true
include_tests=true
[[rules.package-boundaries.boundaries]]
name="native-boundary"
from=["."]
exclude_dirs=["internal/binding"]
deny_imports=["C","unsafe"]
