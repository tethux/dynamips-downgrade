name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      DYNAMIPS_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 clang-tools-19 g++-14 libelf-dev libpcap-dev libnsl-dev pkg-config
      - name: Select Clang 19
        run: |
          mkdir -p "$RUNNER_TEMP/clang-bin"
          ln -s /usr/bin/clang-19 "$RUNNER_TEMP/clang-bin/clang"
          ln -s /usr/bin/clang++-19 "$RUNNER_TEMP/clang-bin/clang++"
          ln -s /usr/bin/clang-scan-deps-19 "$RUNNER_TEMP/clang-bin/clang-scan-deps"
          echo "$RUNNER_TEMP/clang-bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v3
        with:
          install_args: go goreleaser github:xmake-io/xmake
      - run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
