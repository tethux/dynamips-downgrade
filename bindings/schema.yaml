schema_version: 1

conventions:
  c_abi:
    result: dyn_result
    handles: opaque
    strings: borrowed_utf8_nul_terminated
    outputs: cleared_on_error
  cpp:
    standard: c++23
    interface: module
    module: dynamips
    result: std::expected
    handles: move_only_raii
  go:
    standard: "1.26"
    result: error
    handles: explicit_close
  lifetime:
    runtime: process_global
    handles_must_be_released_before: runtime.shutdown
  threading:
    policy: externally_serialized

types:
  void:
    kind: unit
  int:
    kind: scalar
    c_type: int
    cpp_type: int
  int32:
    kind: scalar
    c_type: int32_t
    cpp_type: std::int32_t
  argv:
    kind: slice
    c_type: "char *[]"
    cpp_type: "char *[]"
    element: string
    ownership: borrowed
  runtime:
    kind: context
    ownership: unique
  vm:
    kind: handle
    c_type: dyn_vm
    ownership: registry_reference
    release: dyn_vm_release
  nio:
    kind: handle
    c_type: dyn_nio
    ownership: registry_reference
    release: dyn_nio_release
  string:
    kind: scalar
    c_type: const char *
    cpp_type: std::string_view
    ownership: borrowed
  port:
    kind: scalar
    c_type: uint16_t
    cpp_type: std::uint16_t
  vm_status:
    kind: enum
    c_type: dyn_vm_status
    cpp_type: dynamips::vm_status
    values: [halted, shutdown, running, suspended]
  uint32:
    kind: scalar
    c_type: uint32_t
    cpp_type: std::uint32_t
  nio_stats:
    kind: struct
    c_type: dyn_nio_stats
    cpp_type: dynamips::nio_stats
    fields: [packets_in, packets_out, bytes_in, bytes_out]
  udp_auto_result:
    kind: struct
    cpp_type: dynamips::udp_auto_result
    fields: [endpoint, local_port]

errors:
  - invalid_argument
  - not_initialized
  - already_initialized
  - out_of_memory
  - create_failed
  - start_failed
  - stop_failed
  - internal
  - binding_failed

operations:
  - module: runtime
    operation: init
    c_name: dyn_runtime_init
    cpp_name: dynamips::runtime::init
    go_name: dynamips.New
    args:
      - {name: argc, type: int}
      - {name: argv, type: argv}
    returns: {type: "handle<runtime>", ownership: unique}
    errors: [invalid_argument, already_initialized, start_failed]
    threading: {requires_runtime: false, blocking: false}
    source: {core: [dyn_runtime_init]}

  - module: runtime
    operation: shutdown
    c_name: dyn_runtime_shutdown
    cpp_name: dynamips::runtime::~runtime
    go_name: dynamips.Runtime.Close
    args: []
    returns: {type: void}
    errors: []
    threading: {requires_runtime: true, blocking: true}
    source: {core: [dyn_runtime_shutdown]}

  - module: vm
    operation: create
    c_name: dyn_vm_create
    cpp_name: dynamips::vm::create
    go_name: dynamips.Runtime.CreateVM
    args:
      - {name: name, type: string}
      - {name: instance_id, type: int32}
      - {name: platform, type: string}
    returns: {type: "handle<vm>", ownership: registry_reference}
    errors:
      [invalid_argument, not_initialized, out_of_memory, create_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: stable/hv_vm.c:cmd_create
      core: [vm_create_instance]

  - module: vm
    operation: start
    c_name: dyn_vm_start
    cpp_name: dynamips::vm::start
    go_name: dynamips.VM.Start
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, start_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: stable/hv_vm.c:cmd_start
      core: [vm_init_instance]

  - module: vm
    operation: stop
    c_name: dyn_vm_stop
    cpp_name: dynamips::vm::stop
    go_name: dynamips.VM.Stop
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, stop_failed, internal]
    threading: {requires_runtime: true, blocking: true}
    source:
      cli: stable/hv_vm.c:cmd_stop
      core: [vm_stop_instance]

  - module: vm
    operation: status
    c_name: dyn_vm_get_status
    cpp_name: dynamips::vm::status
    go_name: dynamips.VM.Status
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
    returns: {type: vm_status}
    errors: [invalid_argument, not_initialized, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: stable/hv_vm.c:cmd_get_status
      core: [vm_instance_t.status]

  - module: vm
    operation: set_ram
    c_name: dyn_vm_set_ram
    cpp_name: dynamips::vm::set_ram
    go_name: dynamips.VM.SetRAM
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: megabytes, type: uint32}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: stable/hv_vm.c:cmd_set_ram
      core: [vm_instance_t.ram_size, c7200_t.npe400_ram_size]

  - module: vm
    operation: attach_nio
    c_name: dyn_vm_attach_nio
    cpp_name: dynamips::vm::attach_nio
    go_name: dynamips.VM.AttachNIO
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: slot, type: uint32}
      - {name: port, type: uint32}
      - {name: nio, type: "handle<nio>", ownership: borrowed}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, binding_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: stable/hv_vm.c:cmd_slot_add_nio_binding
      core: [vm_slot_add_nio_binding]

  - module: nio
    operation: create_udp
    c_name: dyn_nio_create_udp
    cpp_name: dynamips::nio::create_udp
    go_name: dynamips.Runtime.CreateUDP
    args:
      - {name: name, type: string}
      - {name: local_port, type: port}
      - {name: remote_host, type: string}
      - {name: remote_port, type: port}
    returns: {type: "handle<nio>", ownership: registry_reference}
    errors:
      [invalid_argument, not_initialized, out_of_memory, create_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: common/hv_nio.c:cmd_create_udp
      core: [netio_desc_create_udp]

  - module: nio
    operation: stats
    c_name: dyn_nio_get_stats
    cpp_name: dynamips::nio::stats
    go_name: dynamips.NIO.Stats
    args:
      - {name: nio, type: "handle<nio>", ownership: borrowed}
    returns: {type: nio_stats}
    errors: [invalid_argument, not_initialized, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: common/hv_nio.c:cmd_get_stats
      core: [netio_desc_t.stats_pkts_in, netio_desc_t.stats_pkts_out, netio_desc_t.stats_bytes_in, netio_desc_t.stats_bytes_out]

  - module: nio
    operation: create_udp_auto
    c_name: dyn_nio_create_udp_auto
    cpp_name: dynamips::nio::create_udp_auto
    go_name: dynamips.Runtime.CreateUDPAuto
    args:
      - {name: name, type: string}
      - {name: local_addr, type: string}
      - {name: port_start, type: port}
      - {name: port_end, type: port}
    returns: {type: udp_auto_result, ownership: registry_reference}
    errors: [invalid_argument, not_initialized, out_of_memory, create_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: common/hv_nio.c:cmd_create_udp_auto
      core: [netio_desc_create_udp_auto, netio_udp_auto_get_local_port]
