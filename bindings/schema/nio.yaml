schema_version: 1

scope:
  required:
    [create_udp, create_udp_auto, connect_udp_auto, create_tap, stats,
     setup_filter, delete]
  deferred: [create_unix, create_vde, create_fifo, create_gen_eth, create_linux_eth, create_null]
  legacy_only: [rename, list, set_debug]

unresolved: {}

operations:
  - module: nio
    operation: create_udp
    classification: required
    c_name: dyn_nio_create_udp
    cpp_name: dynamips::nio::create_udp
    go_name: dynamips.Runtime.CreateUDP
    c_signature: "dyn_result(constchar*,uint16_t,constchar*,uint16_t,dyn_nio**)"
    cpp_signature: "result<nio>(std::string_view,std::uint16_t,std::string_view,std::uint16_t)noexcept"
    go_signature: "(UDPConfig)(*NIO,error)"
    args:
      - {name: name, type: string}
      - {name: local_port, type: port}
      - {name: remote_host, type: string}
      - {name: remote_port, type: port}
    returns: {type: "handle<nio>", ownership: registry_reference}
    errors:
      [invalid_argument, not_initialized, out_of_memory, create_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: common/hv_nio.c:cmd_create_udp
      core: [netio_desc_create_udp]

  - module: nio
    operation: stats
    classification: required
    c_name: dyn_nio_get_stats
    cpp_name: dynamips::nio::stats
    go_name: dynamips.NIO.Stats
    c_signature: "dyn_result(constdyn_nio*,dyn_nio_stats*)"
    cpp_signature: "result<nio_stats>()constnoexcept"
    go_signature: "()(NIOStats,error)"
    args:
      - {name: nio, type: "handle<nio>", ownership: borrowed}
    returns: {type: nio_stats}
    errors: [invalid_argument, not_initialized, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: common/hv_nio.c:cmd_get_stats
      core: [netio_desc_t.stats_pkts_in, netio_desc_t.stats_pkts_out, netio_desc_t.stats_bytes_in, netio_desc_t.stats_bytes_out]

  - module: nio
    operation: create_udp_auto
    classification: required
    c_name: dyn_nio_create_udp_auto
    cpp_name: dynamips::nio::create_udp_auto
    go_name: dynamips.Runtime.CreateUDPAuto
    c_signature: "dyn_result(constchar*,constchar*,uint16_t,uint16_t,dyn_nio**,uint16_t*)"
    cpp_signature: "result<udp_auto_result>(std::string_view,std::string_view,std::uint16_t,std::uint16_t)noexcept"
    go_signature: "(UDPAutoConfig)(*NIO,uint16,error)"
    args:
      - {name: name, type: string}
      - {name: local_addr, type: string}
      - {name: port_start, type: port}
      - {name: port_end, type: port}
    returns: {type: udp_auto_result, ownership: registry_reference}
    errors: [invalid_argument, not_initialized, out_of_memory, create_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: common/hv_nio.c:cmd_create_udp_auto
      core: [netio_desc_create_udp_auto, netio_udp_auto_get_local_port]

  - module: nio
    operation: setup_filter
    classification: required
    c_name: dyn_nio_setup_filter
    cpp_name: dynamips::nio::setup_filter
    go_name: dynamips.NIO.SetupFilter
    c_signature: "dyn_result(dyn_nio*,int32_t,size_t,constchar*const[])"
    cpp_signature: "result<void>(filter_direction,std::span<conststd::string_view>)noexcept"
    go_signature: "(FilterDirection,...string)(error)"
    args:
      - {name: nio, type: "handle<nio>", ownership: borrowed}
      - {name: direction, type: filter_direction}
      - {name: options, type: string_slice}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, out_of_memory, invalid_state, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: common/hv_nio.c:cmd_setup_filter
      core: [netio_filter_setup]

  - module: nio
    operation: connect_udp_auto
    classification: required
    c_name: dyn_nio_connect_udp_auto
    cpp_name: dynamips::nio::connect_udp_auto
    go_name: dynamips.NIO.ConnectUDPAuto
    c_signature: "dyn_result(dyn_nio*,constchar*,uint16_t)"
    cpp_signature: "result<void>(std::string_view,std::uint16_t)noexcept"
    go_signature: "(string,uint16)(error)"
    args:
      - {name: nio, type: "handle<nio>", ownership: borrowed}
      - {name: remote_host, type: string}
      - {name: remote_port, type: port}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, invalid_state, create_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: common/hv_nio.c:cmd_connect_udp_auto
      core: [netio_udp_auto_connect]

  - module: nio
    operation: create_tap
    classification: required
    c_name: dyn_nio_create_tap
    cpp_name: dynamips::nio::create_tap
    go_name: dynamips.Runtime.CreateTAP
    c_signature: "dyn_result(constchar*,constchar*,dyn_nio**)"
    cpp_signature: "result<nio>(std::string_view,std::string_view)noexcept"
    go_signature: "(TAPConfig)(*NIO,error)"
    args:
      - {name: name, type: string}
      - {name: device, type: string}
    returns: {type: "handle<nio>", ownership: registry_reference}
    errors: [invalid_argument, not_initialized, out_of_memory, create_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: common/hv_nio.c:cmd_create_tap
      core: [netio_desc_create_tap]

  - module: nio
    operation: delete
    classification: required
    c_name: dyn_nio_delete
    cpp_name: dynamips::nio::remove
    go_name: dynamips.NIO.Delete
    c_signature: "dyn_result(dyn_nio**)"
    cpp_signature: "result<void>()noexcept"
    go_signature: "()(error)"
    args:
      - {name: nio, type: "handle<nio>", ownership: consumed_on_success}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, out_of_memory, invalid_state, internal]
    threading: {requires_runtime: true, blocking: false}
    ownership: "Release the public registry reference, then delete only at refcount zero. Restore the reference if attachments still own the object. The handle is consumed only on success."
    source:
      cli: common/hv_nio.c:cmd_delete
      core: [netio_release, netio_delete, netio_acquire]
