schema_version: 1

scope:
  required:
    [create, delete, start, stop, suspend, resume, status, set_ios, set_ram,
     set_nvram, set_sparse_mem, set_conf_reg, set_idle_pc, set_con_tcp_port,
     push_config, extract_config, slot_add_binding, slot_remove_binding,
     slot_add_nio_binding, slot_remove_nio_binding]
  deferred: [set_config, get_idle_pc_prop, set_disk0, set_disk1]
  legacy_only:
    [rename, list, list_con_ports, slot_bindings, slot_nio_bindings,
     set_debug_level, cpu_info, cpu_usage, show_timer_drift,
     show_idle_pc_prop, show_hardware, send_con_msg, send_aux_msg,
     set_aux_tcp_port, clean_delete, oir_start, oir_stop, ghost_support]

unresolved:
  console: "Resolve console ownership and event semantics before adding callbacks."
  delete: "When another native reference prevents deletion, the handle is restored and deletion returns invalid_state. Registry destructor failure is detected by checking whether the entry remains."

operations:
  - {module: vm, operation: slot_add_binding, classification: required, c_name: dyn_vm_add_card, cpp_name: dynamips::vm::add_card, go_name: dynamips.VM.AddCard, args: [{name: slot, type: uint32}, {name: card, type: string}], errors: [invalid_argument, not_initialized, binding_failed, internal], source: {cli: stable/hv_vm.c:cmd_slot_add_binding, core: [vm_slot_add_binding]}}
  - {module: vm, operation: slot_remove_binding, classification: required, c_name: dyn_vm_remove_card, cpp_name: dynamips::vm::remove_card, go_name: dynamips.VM.RemoveCard, args: [{name: slot, type: uint32}], errors: [invalid_argument, not_initialized, binding_failed, internal], source: {cli: stable/hv_vm.c:cmd_slot_remove_binding, core: [vm_slot_remove_binding, vm_slot_remove_all_nio_bindings]}}
  - {module: vm, operation: slot_remove_nio_binding, classification: required, c_name: dyn_vm_detach_nio, cpp_name: dynamips::vm::detach_nio, go_name: dynamips.VM.DetachNIO, args: [{name: slot, type: uint32}, {name: port, type: uint32}], errors: [invalid_argument, not_initialized, binding_failed, internal], source: {cli: stable/hv_vm.c:cmd_slot_remove_nio_binding, core: [vm_slot_remove_nio_binding]}}
  - module: vm
    operation: delete
    classification: required
    c_name: dyn_vm_delete
    cpp_name: dynamips::vm::delete_instance
    go_name: dynamips.VM.Delete
    args: [{name: vm, type: "handle<vm>", ownership: consumed_on_success}]
    returns: {type: void}
    errors: [invalid_argument, not_initialized, invalid_state, internal]
    threading: {requires_runtime: true, blocking: true}
    source: {cli: stable/hv_vm.c:cmd_delete, core: [vm_release, vm_delete_instance, vm_acquire]}

  - module: vm
    operation: suspend
    classification: required
    c_name: dyn_vm_suspend
    cpp_name: dynamips::vm::suspend
    go_name: dynamips.VM.Suspend
    args: [{name: vm, type: "handle<vm>", ownership: borrowed}]
    returns: {type: void}
    errors: [invalid_argument, not_initialized, invalid_state, internal]
    threading: {requires_runtime: true, blocking: true}
    source: {cli: stable/hv_vm.c:cmd_suspend, core: [vm_suspend]}

  - module: vm
    operation: resume
    classification: required
    c_name: dyn_vm_resume
    cpp_name: dynamips::vm::resume
    go_name: dynamips.VM.Resume
    args: [{name: vm, type: "handle<vm>", ownership: borrowed}]
    returns: {type: void}
    errors: [invalid_argument, not_initialized, invalid_state, internal]
    threading: {requires_runtime: true, blocking: true}
    source: {cli: stable/hv_vm.c:cmd_resume, core: [vm_resume]}

  - module: vm
    operation: set_ios
    classification: required
    c_name: dyn_vm_set_ios
    cpp_name: dynamips::vm::set_ios
    go_name: dynamips.VM.SetIOS
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: path, type: string, ownership: copied}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, out_of_memory, internal]
    threading: {requires_runtime: true, blocking: false}
    source: {cli: stable/hv_vm.c:cmd_set_ios, core: [vm_ios_set_image]}

  - module: vm
    operation: set_nvram
    classification: required
    c_name: dyn_vm_set_nvram
    cpp_name: dynamips::vm::set_nvram
    go_name: dynamips.VM.SetNVRAM
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: kilobytes, type: uint32}
    returns: {type: void}
    errors: [invalid_argument, not_initialized]
    threading: {requires_runtime: true, blocking: false}
    source: {cli: stable/hv_vm.c:cmd_set_nvram, core: [vm_instance_t.nvram_size]}

  - module: vm
    operation: set_sparse_mem
    classification: required
    c_name: dyn_vm_set_sparse_mem
    cpp_name: dynamips::vm::set_sparse_mem
    go_name: dynamips.VM.SetSparseMemory
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: enabled, type: bool}
    returns: {type: void}
    errors: [invalid_argument, not_initialized]
    threading: {requires_runtime: true, blocking: false}
    source: {cli: stable/hv_vm.c:cmd_set_sparse_mem, core: [vm_instance_t.sparse_mem]}

  - module: vm
    operation: set_conf_reg
    classification: required
    c_name: dyn_vm_set_conf_reg
    cpp_name: dynamips::vm::set_conf_reg
    go_name: dynamips.VM.SetConfigRegister
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: value, type: uint32}
    returns: {type: void}
    errors: [invalid_argument, not_initialized]
    threading: {requires_runtime: true, blocking: false}
    source: {cli: stable/hv_vm.c:cmd_set_conf_reg, core: [vm_instance_t.conf_reg_setup]}

  - module: vm
    operation: set_idle_pc
    classification: required
    c_name: dyn_vm_set_idle_pc
    cpp_name: dynamips::vm::set_idle_pc
    go_name: dynamips.VM.SetIdlePC
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: value, type: uint64}
    returns: {type: void}
    errors: [invalid_argument, not_initialized]
    threading: {requires_runtime: true, blocking: false}
    source: {cli: stable/hv_vm.c:cmd_set_idle_pc, core: [vm_instance_t.idle_pc]}

  - module: vm
    operation: set_con_tcp_port
    classification: required
    c_name: dyn_vm_set_con_tcp_port
    cpp_name: dynamips::vm::set_con_tcp_port
    go_name: dynamips.VM.SetConsoleTCPPort
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: port, type: uint16}
    returns: {type: void}
    errors: [invalid_argument, not_initialized]
    threading: {requires_runtime: true, blocking: false}
    source: {cli: stable/hv_vm.c:cmd_set_con_tcp_port, core: [vm_instance_t.vtty_con_type, vm_instance_t.vtty_con_tcp_port]}

  - module: vm
    operation: push_config
    classification: required
    c_name: dyn_vm_push_config
    cpp_name: dynamips::vm::push_config
    go_name: dynamips.VM.PushConfig
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: startup, type: optional_bytes, ownership: borrowed}
      - {name: private, type: optional_bytes, ownership: borrowed}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, unsupported, io, internal]
    threading: {requires_runtime: true, blocking: true}
    source: {cli: stable/hv_vm.c:cmd_push_config, core: [vm_platform_t.nvram_push_config]}
  - module: vm
    operation: create
    classification: required
    c_name: dyn_vm_create
    cpp_name: dynamips::vm::create
    go_name: dynamips.Runtime.CreateVM
    args:
      - {name: name, type: string}
      - {name: instance_id, type: int32}
      - {name: platform, type: string}
    returns: {type: "handle<vm>", ownership: registry_reference}
    errors:
      [invalid_argument, not_initialized, out_of_memory, create_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: stable/hv_vm.c:cmd_create
      core: [vm_create_instance]

  - module: vm
    operation: start
    classification: required
    c_name: dyn_vm_start
    cpp_name: dynamips::vm::start
    go_name: dynamips.VM.Start
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, start_failed, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: stable/hv_vm.c:cmd_start
      core: [vm_init_instance]

  - module: vm
    operation: stop
    classification: required
    c_name: dyn_vm_stop
    cpp_name: dynamips::vm::stop
    go_name: dynamips.VM.Stop
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, stop_failed, internal]
    threading: {requires_runtime: true, blocking: true}
    source:
      cli: stable/hv_vm.c:cmd_stop
      core: [vm_stop_instance]

  - module: vm
    operation: status
    classification: required
    c_name: dyn_vm_get_status
    cpp_name: dynamips::vm::status
    go_name: dynamips.VM.Status
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
    returns: {type: vm_status}
    errors: [invalid_argument, not_initialized, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: stable/hv_vm.c:cmd_get_status
      core: [vm_instance_t.status]

  - module: vm
    operation: set_ram
    classification: required
    c_name: dyn_vm_set_ram
    cpp_name: dynamips::vm::set_ram
    go_name: dynamips.VM.SetRAM
    args:
      - {name: vm, type: "handle<vm>", ownership: borrowed}
      - {name: megabytes, type: uint32}
    returns: {type: void}
    errors: [invalid_argument, not_initialized, internal]
    threading: {requires_runtime: true, blocking: false}
    source:
      cli: stable/hv_vm.c:cmd_set_ram
      core: [vm_instance_t.ram_size, c7200_t.npe400_ram_size]

  - module: vm
    operation: slot_add_nio_binding
    classification: required
    c_name: dyn_vm_attach_nio
    cpp_name: dynamips::vm::attach_nio
    go_name: dynamips.VM.AttachNIO
    args:
